<script>
  window.storage = {
    async get(key, shared) {
      const raw = window.localStorage.getItem("ipi_" + key);
      if (raw === null) { throw new Error("Key not found: " + key); }
      return { key, value: raw, shared: !!shared };
    },
    async set(key, value, shared) { window.localStorage.setItem("ipi_" + key, value); return { key, value, shared: !!shared }; },
    async delete(key, shared) { window.localStorage.removeItem("ipi_" + key); return { key, deleted: true, shared: !!shared }; },
    async list(prefix, shared) {
      const p = "ipi_" + (prefix || "");
      const keys = Object.keys(window.localStorage).filter(k => k.startsWith(p)).map(k => k.slice(4));
      return { keys, prefix: prefix || "", shared: !!shared };
    }
  };
</script>
