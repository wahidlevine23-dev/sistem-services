<script>
window.storage = {
  async get(key, shared) {
    const r = await fetch('/api/storage/' + encodeURIComponent(key), {cache:'no-store'});
    if (r.ok) { const j=await r.json(); return {key,value:j.value,shared:true}; }
    const raw=window.localStorage.getItem("ipi_"+key);
    if(raw===null) throw new Error("Key not found");
    // One-time migration from the old browser storage into the central server database.
    await fetch('/api/storage/' + encodeURIComponent(key), {method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({value:raw})});
    return {key,value:raw,shared:true};
  },
  async set(key,value,shared) {
    const r=await fetch('/api/storage/' + encodeURIComponent(key), {method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({value})});
    if(!r.ok) throw new Error('Server storage save failed');
    return {key,value,shared:true};
  },
  async delete(key,shared) {
    const r=await fetch('/api/storage/' + encodeURIComponent(key), {method:'DELETE'});
    if(!r.ok && r.status!==404) throw new Error('Server storage delete failed');
    return {key,deleted:true,shared:true};
  },
  async list(prefix,shared) {
    const r=await fetch('/api/storage?prefix='+encodeURIComponent(prefix||''), {cache:'no-store'});
    if(!r.ok) throw new Error('Server storage list failed');
    const j=await r.json(); return {keys:j.keys,prefix:prefix||'',shared:true};
  }
};
</script>

  siap_invoice: "Siap Dibuatkan Invoice",

  lunas: "Lunas",

};
const SR_STATUS_ORDER = ["baru","diterima","pengecekan","menunggu_quotation","siap_invoice","invoice_terbit","lunas","selesai"];
const SR_STATUS_COLOR = {
  baru: "bg-slate-100 text-slate-600",
  diterima: "bg-sky-100 text-sky-700",
  pengecekan: "bg-amber-100 text-amber-700",
  menunggu_quotation: "bg-violet-100 text-violet-700",
  siap_invoice: "bg-violet-100 text-violet-700",
  invoice_terbit: "bg-orange-100 text-orange-700",
  lunas: "bg-emerald-100 text-emerald-700",
  selesai: "bg-slate-800 text-white",
};

const uid = () => Math.random().toString(36).slice(2, 10) + Date.now().toString(36).slice(-4);

/* ============================= HELPERS ============================= */
function pad2(n) { return String(n).padStart(2, "0"); }
function romanMonth(d) { return ROMAN[d.getMonth()]; }
function formatDateID(d) {
  return d.toLocaleDateString("en-GB", { day: "2-digit", month: "long", year: "numeric" });
}
function formatIDR(n) {
  n = Math.round(n || 0);
  return "Rp" + n.toLocaleString("id-ID");
}
function computeTotals(items, discountPercent, homeServiceFee) {
  const subtotal = (items || []).reduce((s, it) => s + (Number(it.qty) || 0) * (Number(it.price) || 0), 0);
  const discountAmount = Math.round(subtotal * ((Number(discountPercent) || 0) / 100));
  const grandTotal = subtotal - discountAmount + (Number(homeServiceFee) || 0);
  return { subtotal, discountAmount, grandTotal };
}

/* ============================= STORAGE ============================= */
async function getOrDefault(key, def) {
  try {
    const r = await window.storage.get(key, false);
    return r && r.value ? JSON.parse(r.value) : def;
  } catch (e) {
    return def;
  }
}
async function persist(key, value) {
  try {
    await window.storage.set(key, JSON.stringify(value), false);
  } catch (e) {
    console.error("storage save failed", key, e);
  }
}

/* ============================= APP ============================= */
function App() {
  const [loaded, setLoaded] = useState(false);
  const [view, setView] = useState("dashboard");
  const [selectedId, setSelectedId] = useState(null);
  const [printSpec, setPrintSpec] = useState(null); // {docType, id}

  const [settings, setSettings] = useState(DEFAULT_SETTINGS);
  const [inventory, setInventory] = useState(DEFAULT_INVENTORY);
  const [serviceRequests, setServiceRequests] = useState([]);
  const [quotations, setQuotations] = useState([]);
  const [invoices, setInvoices] = useState([]);
  const [counters, setCounters] = useState({});
  const [customers, setCustomers] = useState([]);

  useEffect(() => {
    (async () => {
      const [s, inv, sr, q, iv, c, cust] = await Promise.all([
        getOrDefault("settings", DEFAULT_SETTINGS),
        getOrDefault("inventory", DEFAULT_INVENTORY),
        getOrDefault("serviceRequests", []),
        getOrDefault("quotations", []),
        getOrDefault("invoices", []),
        getOrDefault("counters", {}),
        getOrDefault("customers", []),
      ]);
      setSettings(s); setInventory(inv); setServiceRequests(sr);
      setQuotations(q); setInvoices(iv); setCounters(c); setCustomers(cust);
      setLoaded(true);
    })();
  }, []);

  function updateSettings(next) { setSettings(next); persist("settings", next); }
  function updateInventory(next) { setInventory(next); persist("inventory", next); }
  function updateServiceRequests(next) { setServiceRequests(next); persist("serviceRequests", next); }
  function updateQuotations(next) { setQuotations(next); persist("quotations", next); }
  function updateInvoices(next) { setInvoices(next); persist("invoices", next); }
  function updateCustomers(next) { setCustomers(next); persist("customers", next); }
  function upsertCustomer(data) {
    const phone = (data.phone || "").trim();
    const name = (data.custName || "").trim();
    if (!name && !phone) return;
    const key = phone || name.toLowerCase();
    const found = customers.find(c => (c.phone || "").trim() === phone && phone) || customers.find(c => !phone && (c.name || "").toLowerCase() === name.toLowerCase());
    const now = Date.now();
    const customer = {
      id: found?.id || uid(), name: name || found?.name || "", companyName: data.companyName || found?.companyName || "",
      phone: phone || found?.phone || "", email: data.email || found?.email || "", address: data.address || found?.address || "",
      updatedAt: now, createdAt: found?.createdAt || now
    };
    updateCustomers(found ? customers.map(c => c.id === found.id ? {...c, ...customer} : c) : [customer, ...customers]);
    return customer;
  }
  function applyInvoiceStock(previous, next) {
    const oldMap = {};
    (previous?.items || []).forEach(it => { if (it.inventoryId) oldMap[it.inventoryId] = (oldMap[it.inventoryId] || 0) + Number(it.qty || 0); });
    const newMap = {};
    (next?.items || []).forEach(it => { if (it.inventoryId) newMap[it.inventoryId] = (newMap[it.inventoryId] || 0) + Number(it.qty || 0); });
    const ids = new Set([...Object.keys(oldMap), ...Object.keys(newMap)]);
    return inventory.map(item => {
      if (!ids.has(item.id) || item.category === "Jasa Service" || item.category === "Reset Printer" || item.category === "Instalasi") return item;
      const delta = (oldMap[item.id] || 0) - (newMap[item.id] || 0);
      return {...item, stock: Math.max(0, Number(item.stock || 0) + delta)};
    });
  }

  function genNumber(type) {
    const d = new Date();
    const key = `${type}_${d.getFullYear()}${pad2(d.getMonth() + 1)}${pad2(d.getDate())}`;
    const seq = (counters[key] || 0) + 1;
    const nextCounters = { ...counters, [key]: seq };
    setCounters(nextCounters); persist("counters", nextCounters);
    return `${type}/${pad2(d.getDate())}-${seq}/${romanMonth(d)}/${d.getFullYear()}`;
  }

  function goto(v, id) { setView(v); setSelectedId(id || null); window.scrollTo(0, 0); }
  function openPrint(docType, id) { setPrintSpec({ docType, id }); setView("print"); }

  if (!loaded) {
    return (
      <div className="min-h-[500px] flex items-center justify-center text-slate-400 text-sm">
        Memuat sistem...
      </div>
    );
  }

  if (view === "print" && printSpec) {
    return (
      <PrintScreen
        spec={printSpec}
        settings={settings}
        serviceRequests={serviceRequests}
        quotations={quotations}
        invoices={invoices}
        onBack={() => goto(printSpec.backTo || "dashboard", printSpec.backId)}
      />
    );
  }

  return (
    <div className="min-h-[700px] bg-[#F5F6F4] text-[#1B2129] pb-20 md:pb-6">
      <style>{`
        @media print {
          body { background: white !important; }
        }
      `}</style>
      <TopBar settings={settings} view={view} goto={goto} />
      <div className="max-w-6xl mx-auto px-3 md:px-6 pt-4 md:flex md:gap-6">
        <SideNav view={view} goto={goto} className="hidden md:block" />
        <main className="flex-1 min-w-0">
          {view === "dashboard" && (
            <Dashboard
              serviceRequests={serviceRequests} quotations={quotations} invoices={invoices}
              goto={goto} settings={settings}
            />
          )}
          {view === "service" && (
            <ServiceList serviceRequests={serviceRequests} goto={goto} />
          )}
          {view === "service_form" && (
            <ServiceForm
              settings={settings} inventory={inventory} customers={customers}
              existing={serviceRequests.find(s => s.id === selectedId)}
              onCancel={() => goto("service")}
              onSave={(rec) => {
                let next;
                if (rec.id) {
                  next = serviceRequests.map(s => s.id === rec.id ? rec : s);
                } else {
                  rec.id = uid();
                  rec.no = genNumber("SR");
                  rec.status = "baru";
                  rec.createdAt = Date.now();
                  next = [rec, ...serviceRequests];
                }
                updateServiceRequests(next);
                upsertCustomer(rec);
                goto("service_detail", rec.id);
              }}
            />
          )}
          {view === "service_detail" && (
            <ServiceDetail
              sr={serviceRequests.find(s => s.id === selectedId)}
              settings={settings}
              quotations={quotations}
              invoices={invoices}
              goto={goto}
              openPrint={(t, id) => { setPrintSpec({ docType: t, id, backTo: "service_detail", backId: selectedId }); setView("print"); }}
              onUpdateSR={(rec) => updateServiceRequests(serviceRequests.map(s => s.id === rec.id ? rec : s))}
              onCreateQuotation={(sr) => {
                const q = {
                  id: uid(), no: genNumber("QUO"), date: Date.now(),
                  type: "service_parts", linkedServiceId: sr.id,
                  custName: sr.custName, companyName: sr.companyName, phone: sr.phone,
                  model: sr.model, serialNumber: sr.serialNumber,
                  items: [], discountPercent: 0, distanceKm: sr.distanceKm || 0,
                  notes: "", status: "draft", createdAt: Date.now(),
                };
                updateQuotations([q, ...quotations]);
                const nextSR = { ...sr, status: "menunggu_quotation", linkedQuotationId: q.id };
                updateServiceRequests(serviceRequests.map(s => s.id === sr.id ? nextSR : s));
                goto("quotation_form", q.id);
              }}
              onCreateInvoice={(sr) => {
                const inv = {
                  id: uid(), no: genNumber("INV"), date: Date.now(),
                  linkedServiceId: sr.id,
                  custName: sr.custName, companyName: sr.companyName, phone: sr.phone,
                  model: sr.model, serialNumber: sr.serialNumber,
                  items: sr.items && sr.items.length ? sr.items : [],
                  discountPercent: sr.discountPercent || 0, distanceKm: sr.distanceKm || 0,
                  paymentType: "full", payments: [], status: "unpaid", createdAt: Date.now(),
                };
                updateInvoices([inv, ...invoices]);
                const nextSR = { ...sr, status: "invoice_terbit", linkedInvoiceId: inv.id };
                updateServiceRequests(serviceRequests.map(s => s.id === sr.id ? nextSR : s));
                goto("invoice_form", inv.id);
              }}
            />
          )}

          {view === "quotation" && (
            <QuotationList quotations={quotations} goto={goto} />
          )}
          {view === "quotation_form" && (
            <QuotationForm
              settings={settings} inventory={inventory}
              existing={quotations.find(q => q.id === selectedId)}
              onCancel={() => goto("quotation")}
              onSave={(rec) => {
                let next;
                if (rec.id) {
                  next = quotations.map(q => q.id === rec.id ? rec : q);
                } else {
                  rec.id = uid(); rec.no = genNumber("QUO"); rec.date = Date.now();
                  rec.status = "draft"; rec.createdAt = Date.now();
                  next = [rec, ...quotations];
                }
                updateQuotations(next);
                goto("quotation_detail", rec.id);
              }}
            />
          )}
          {view === "quotation_detail" && (
            <QuotationDetail
              q={quotations.find(q => q.id === selectedId)}
              settings={settings}
              sr={serviceRequests.find(s => s.id === (quotations.find(q => q.id === selectedId) || {}).linkedServiceId)}
              goto={goto}
              openPrint={(t, id) => { setPrintSpec({ docType: t, id, backTo: "quotation_detail", backId: selectedId }); setView("print"); }}
              onUpdateStatus={(status) => {
                const q = quotations.find(x => x.id === selectedId);
                const nextQ = { ...q, status };
                updateQuotations(quotations.map(x => x.id === q.id ? nextQ : x));
                if (q.linkedServiceId && status === "approved") {
                  const sr = serviceRequests.find(s => s.id === q.linkedServiceId);
                  if (sr) updateServiceRequests(serviceRequests.map(s => s.id === sr.id ? { ...sr, status: "siap_invoice" } : s));
                }
              }}
            />
          )}

          {view === "invoice" && (
            <InvoiceList invoices={invoices} goto={goto} />
          )}
          {view === "invoice_form" && (
            <InvoiceForm
              settings={settings} inventory={inventory} customers={customers}
              existing={invoices.find(i => i.id === selectedId)}
              onCancel={() => goto("invoice")}
              onSave={(rec) => {
                let next;
                if (rec.id) {
                  next = invoices.map(i => i.id === rec.id ? rec : i);
                } else {
                  rec.id = uid(); rec.no = genNumber("INV"); rec.date = Date.now();
                  rec.status = "unpaid"; rec.payments = []; rec.createdAt = Date.now();
                  next = [rec, ...invoices];
                }
                updateInvoices(next);
                upsertCustomer(rec);
                if (!rec.id || !invoices.find(i => i.id === rec.id)) {
                  updateInventory(applyInvoiceStock(null, rec));
                } else {
                  updateInventory(applyInvoiceStock(invoices.find(i => i.id === rec.id), rec));
                }
                goto("invoice_detail", rec.id);
              }}
            />
          )}
          {view === "invoice_detail" && (
            <InvoiceDetail
              inv={invoices.find(i => i.id === selectedId)}
              settings={settings}
              goto={goto}
              openPrint={(t, id) => { setPrintSpec({ docType: t, id, backTo: "invoice_detail", backId: selectedId }); setView("print"); }}
              onUpdate={(rec) => {
                const prevInv = invoices.find(i => i.id === rec.id);
                updateInvoices(invoices.map(i => i.id === rec.id ? rec : i));
                if (rec.status === "cancelled" && prevInv?.status !== "cancelled") updateInventory(applyInvoiceStock(prevInv, {...rec, items: []}));
                if (rec.linkedServiceId && rec.status === "paid") {
                  const sr = serviceRequests.find(s => s.id === rec.linkedServiceId);
                  if (sr) updateServiceRequests(serviceRequests.map(s => s.id === sr.id ? { ...sr, status: "lunas" } : s));
                }
              }}
            />
          )}

          {view === "inventory" && (
            <InventoryPage inventory={inventory} onChange={updateInventory} settings={settings} onSettings={updateSettings} />
          )}
          {view === "customers" && (
            <CustomersPage customers={customers} serviceRequests={serviceRequests} invoices={invoices} goto={goto}
              onClaim={(c) => {
                const rec = { id: uid(), no: genNumber("SR"), status: "baru", createdAt: Date.now(),
                  custName: c.name, companyName: c.companyName || "", phone: c.phone || "",
                  model: c.model || "", serialNumber: c.serialNumber || "", problems: ["Klaim Garansi"],
                  completeness: [], items: [], discountPercent: 0, distanceKm: 0, warrantyClaim: true };
                updateServiceRequests([rec, ...serviceRequests]); goto("service_detail", rec.id);
              }} />
          )}
          {view === "finance" && (
            <FinancialReport invoices={invoices} serviceRequests={serviceRequests} inventory={inventory} settings={settings} />
          )}
          {view === "settings" && (
            <SettingsPage settings={settings} onSave={updateSettings} />
          )}
        </main>
      </div>
      <BottomNav view={view} goto={goto} />
    </div>
  );
}

            <Database size={16} className="text-[#123A3A]" />

          </Card>
        </button>

      <Card className="p-4 mb-6">
        <div className="flex items-center justify-between mb-3">
          <div><div className="text-sm font-semibold">Ringkasan Keuangan</div><div className="text-[11px] text-slate-400">Total semua transaksi tersimpan</div></div>

const PROBLEM_OPTIONS = ["Print Quality", "Paper Jam", "General Error", "No Power", "Reset", "Installation", "Lainnya"];
const COMPLETENESS_OPTIONS = ["Tas", "Dus", "Kabel USB", "Kabel Power", "Lainnya"];

function ChecklistRow({ options, selected, onToggle, otherValue, onOtherChange }) {
  return (
    <div className="flex flex-wrap gap-2">
      {options.map(opt => {
        const active = selected.includes(opt);
        return (
          <button
            type="button" key={opt}
            onClick={() => onToggle(opt)}
            className={`text-xs px-2.5 py-1.5 rounded-full border ${active ? "bg-[#123A3A] text-white border-[#123A3A]" : "border-slate-300 text-slate-600"}`}
          >
            {opt}
          </button>
        );
      })}
      {selected.includes("Lainnya") && (
        <input
          value={otherValue} onChange={e => onOtherChange(e.target.value)}
          placeholder="Tulis manual..." className={inputCls + " w-full mt-1"}
        />
      )}
    </div>
  );
}

function ItemsEditor({ items, setItems, inventory }) {
  const [pick, setPick] = useState("");
  function addItem(prefill) {
    setItems([...items, { id: uid(), inventoryId: prefill?.id || "", desc: prefill?.name || "", qty: 1, price: prefill?.price || 0, costPrice: prefill?.costPrice || 0, condition: prefill?.condition || "new" }]);
  }
  function updateItem(id, patch) { setItems(items.map(it => it.id === id ? { ...it, ...patch } : it)); }
  function removeItem(id) { setItems(items.filter(it => it.id !== id)); }
  return (
    <div>
      <div className="flex gap-2 mb-2">
        <select value={pick} onChange={e => { const item=inventory.find(i=>i.id===e.target.value); if(item) addItem(item); setPick(""); }} className={inputCls+" text-xs flex-1"}>
          <option value="">+ Tambah dari inventory...</option>
          {INV_CATEGORIES.map(cat => <optgroup key={cat} label={cat}>{inventory.filter(i=>i.category===cat && (i.category==="Jasa Service" || i.category==="Reset Printer" || i.category==="Instalasi" || Number(i.stock||0)>0)).map(i =>
            <option key={i.id} value={i.id}>{i.name} — {formatIDR(i.price)} {i.category.includes("Sparepart") ? `(${i.condition==="used"?"Bekas":"Baru"}, stok ${i.stock||0})` : ""}</option>)}</optgroup>)}
        </select>
        <button type="button" onClick={() => addItem()} className="border border-slate-300 rounded-lg px-3 text-xs text-slate-600 shrink-0">+ Manual</button>
      </div>
      <div className="border border-slate-200 rounded-lg overflow-hidden">
        <table className="w-full text-xs">
          <thead className="bg-slate-50 text-slate-500"><tr><th className="text-left px-2.5 py-2 font-medium">Deskripsi</th><th className="text-center px-2 py-2 font-medium w-14">Qty</th><th className="text-right px-2.5 py-2 font-medium w-28">Harga</th><th className="w-8"></th></tr></thead>
          <tbody>
            {items.length===0 && <tr><td colSpan={4} className="text-center text-slate-400 py-4">Belum ada item</td></tr>}
            {items.map(it => <tr key={it.id} className="border-t border-slate-100">
              <td className="px-2.5 py-1.5"><input value={it.desc} onChange={e=>updateItem(it.id,{desc:e.target.value})} className="w-full border-0 focus:outline-none text-xs bg-transparent" placeholder="Deskripsi item"/></td>
              <td className="px-2 py-1.5"><input type="number" min="0" value={it.qty} onChange={e=>updateItem(it.id,{qty:e.target.value})} className="w-full border-0 focus:outline-none text-xs text-center bg-transparent"/></td>
              <td className="px-2.5 py-1.5"><input type="number" min="0" value={it.price} onChange={e=>updateItem(it.id,{price:e.target.value})} className="w-full border-0 focus:outline-none text-xs text-right bg-transparent"/></td>
              <td className="text-center"><button type="button" onClick={()=>removeItem(it.id)} className="text-slate-300 hover:text-red-500"><Trash2 size={13}/></button></td>
            </tr>)}
          </tbody>
        </table>
      </div>
    </div>
  );
}

function TotalsBlock({ items, discountPercent, setDiscountPercent, distanceKm, setDistanceKm, homeServiceRate }) {
  const homeServiceFee = (Number(distanceKm) || 0) * homeServiceRate;
  const { subtotal, discountAmount, grandTotal } = computeTotals(items, discountPercent, homeServiceFee);
  return (
    <div className="grid grid-cols-2 gap-3 mt-3">
      <Field label="Jarak Home Service (KM)" hint="Cek jarak di Google Maps (mode motor)">
        <input type="number" min="0" step="0.1" value={distanceKm} onChange={e => setDistanceKm(e.target.value)} className={inputCls} />
      </Field>
      <Field label="Diskon (%)">
        <input type="number" min="0" max="100" value={discountPercent} onChange={e => setDiscountPercent(e.target.value)} className={inputCls} />
      </Field>
      <div className="col-span-2 bg-slate-50 rounded-lg p-3 text-xs space-y-1">
        <div className="flex justify-between"><span className="text-slate-500">Subtotal</span><span>{formatIDR(subtotal)}</span></div>
        <div className="flex justify-between"><span className="text-slate-500">Home Service ({distanceKm || 0} km &times; {formatIDR(homeServiceRate)})</span><span>{formatIDR(homeServiceFee)}</span></div>
        <div className="flex justify-between"><span className="text-slate-500">Diskon ({discountPercent || 0}%)</span><span>- {formatIDR(discountAmount)}</span></div>
        <div className="flex justify-between font-semibold text-sm pt-1 border-t border-slate-200"><span>Grand Total</span><span>{formatIDR(grandTotal)}</span></div>
      </div>
    </div>
  );
}

function ServiceForm({ settings, inventory, customers, existing, onSave, onCancel }) {
  const [custName, setCustName] = useState(existing?.custName || "");
  const [companyName, setCompanyName] = useState(existing?.companyName || "");
  const [phone, setPhone] = useState(existing?.phone || "");
  const [model, setModel] = useState(existing?.model || "");
  const [serialNumber, setSerialNumber] = useState(existing?.serialNumber || "");
  const [problems, setProblems] = useState(existing?.problems || []);
  const [problemOther, setProblemOther] = useState(existing?.problemOther || "");
  const [completeness, setCompleteness] = useState(existing?.completeness || []);
  const [completenessOther, setCompletenessOther] = useState(existing?.completenessOther || "");
  const [items, setItems] = useState(existing?.items || []);

  const [distanceKm, setDistanceKm] = useState(existing?.distanceKm || 0);

  function toggle(list, setList, val) {
    setList(list.includes(val) ? list.filter(x => x !== val) : [...list, val]);
  }

  function submit(e) {
    e.preventDefault();
    const rec = {
      ...(existing || {}),
      custName, companyName, phone, model, serialNumber,
      problems, problemOther, completeness, completenessOther,
      items, discountPercent: Number(discountPercent), distanceKm: Number(distanceKm),

  return (
    <div>

        <Card className="p-4 mb-3">
          {customers?.length > 0 && <Field label="Pilih customer lama">
            <select className={inputCls} defaultValue="" onChange={e=>{const c=customers.find(x=>x.id===e.target.value);if(c){setCustName(c.name||"");setCompanyName(c.companyName||"");setPhone(c.phone||"");}}}>
              <option value="">— Customer baru / pilih —</option>{customers.map(c=><option key={c.id} value={c.id}>{c.name} {c.phone?"• "+c.phone:""}</option>)}
            </select>
          </Field>}
          <Field label="Nama Customer / Perusahaan"><input required value={custName} onChange={e => setCustName(e.target.value)} className={inputCls} /></Field>

          <Field label="No. HP / WhatsApp"><input value={phone} onChange={e => setPhone(e.target.value)} className={inputCls} /></Field>
          <div className="grid grid-cols-2 gap-3">
            <Field label="Model Printer/Komputer"><input required value={model} onChange={e => setModel(e.target.value)} className={inputCls} /></Field>
            <Field label="Serial Number"><input value={serialNumber} onChange={e => setSerialNumber(e.target.value)} className={inputCls} /></Field>
          </div>
        </Card>

        <Card className="p-4 mb-3">
          <Field label="Masalah / Problem">
            <ChecklistRow options={PROBLEM_OPTIONS} selected={problems} onToggle={v => toggle(problems, setProblems, v)} otherValue={problemOther} onOtherChange={setProblemOther} />
          </Field>
          <Field label="Kelengkapan Unit yang Ditinggal">
            <ChecklistRow options={COMPLETENESS_OPTIONS} selected={completeness} onToggle={v => toggle(completeness, setCompleteness, v)} otherValue={completenessOther} onOtherChange={setCompletenessOther} />

        <Card className="p-4 mb-3">
          <div className="text-xs font-medium text-slate-600 mb-2">Estimasi Biaya (opsional saat penerimaan)</div>

        <button type="submit" className="w-full bg-[#123A3A] text-white rounded-lg py-2.5 text-sm font-medium flex items-center justify-center gap-2">
          <Save size={15} /> Simpan Service Request
        </button>
      </form>
    </div>
  );
}

function Stepper({ statusOrder, currentStatus, labels }) {
  const idx = statusOrder.indexOf(currentStatus);
  return (
    <div className="flex items-center overflow-x-auto pb-1 gap-1">
      {statusOrder.map((s, i) => (
        <div key={s} className="flex items-center shrink-0">
          <div className={`flex items-center gap-1 text-[10.5px] px-2 py-1 rounded-full ${i <= idx ? "bg-[#123A3A] text-white" : "bg-slate-100 text-slate-400"}`}>
            {i <= idx ? <CheckCircle2 size={11} /> : <Circle size={11} />}
            {labels[s]}
          </div>
          {i < statusOrder.length - 1 && <div className={`w-3 h-px ${i < idx ? "bg-[#123A3A]" : "bg-slate-200"}`} />}
        </div>
      ))}
    </div>
  );
}

function ServiceDetail({ sr, settings, quotations, invoices, goto, openPrint, onUpdateSR, onCreateQuotation, onCreateInvoice }) {
  if (!sr) return <div className="text-sm text-slate-400">Data tidak ditemukan.</div>;
  const linkedQ = quotations.find(q => q.id === sr.linkedQuotationId);
  const linkedInv = invoices.find(i => i.id === sr.linkedInvoiceId);
  const { subtotal, discountAmount, grandTotal } = computeTotals(sr.items, sr.discountPercent, (sr.distanceKm || 0) * settings.homeServiceRate);

  return (
    <div>
      <SectionHeader title={sr.no} subtitle={sr.custName} action={
        <button onClick={() => goto("service")} className="text-sm text-slate-500 flex items-center gap-1"><ArrowLeft size={15} /> Kembali</button>

      <Card className="p-4 mb-3">
        <Stepper
          statusOrder={sr.status === "menunggu_quotation" || sr.status === "siap_invoice" ? ["baru","diterima","pengecekan","menunggu_quotation","siap_invoice","invoice_terbit","lunas","selesai"] : SR_STATUS_ORDER}
          currentStatus={sr.status}

        {sr.phone && <div className="flex justify-between text-sm"><span className="text-slate-500">Kontak</span><span>{sr.phone}</span></div>}
        {sr.problems?.length > 0 && <div className="flex justify-between text-sm gap-4"><span className="text-slate-500 shrink-0">Masalah</span><span className="text-right">{sr.problems.filter(p => p !== "Lainnya").join(", ")}{sr.problemOther ? `, ${sr.problemOther}` : ""}</span></div>}
        {sr.completeness?.length > 0 && <div className="flex justify-between text-sm gap-4"><span className="text-slate-500 shrink-0">Kelengkapan</span><span className="text-right">{sr.completeness.filter(p => p !== "Lainnya").join(", ")}{sr.completenessOther ? `, ${sr.completenessOther}` : ""}</span></div>}
        <div className="flex justify-between text-sm pt-2 border-t border-slate-100"><span className="text-slate-500">Estimasi Total</span><span className="font-semibold">{formatIDR(grandTotal)}</span></div>

      <div className="flex gap-2 mb-3">

      </div>

      <Card className="p-4 mb-3">
        <div className="text-xs font-medium text-slate-600 mb-2">Tindakan</div>
        <div className="flex flex-col gap-2">
          {sr.status === "baru" && (
            <button onClick={() => onUpdateSR({ ...sr, status: "diterima" })} className="bg-[#123A3A] text-white rounded-lg py-2 text-sm">Terima Servis</button>
          )}
          {sr.status === "diterima" && (
            <button onClick={() => onUpdateSR({ ...sr, status: "pengecekan" })} className="bg-[#123A3A] text-white rounded-lg py-2 text-sm">Mulai Pengecekan</button>
          )}
          {sr.status === "pengecekan" && (
            <>
              <button onClick={() => onCreateInvoice(sr)} className="bg-[#123A3A] text-white rounded-lg py-2 text-sm">Tidak Perlu Parts &rarr; Buat Invoice</button>
              <button onClick={() => onCreateQuotation(sr)} className="border border-[#123A3A] text-[#123A3A] rounded-lg py-2 text-sm">Perlu Parts &rarr; Buat Quotation</button>
            </>
          )}
          {sr.status === "menunggu_quotation" && linkedQ && (
            <button onClick={() => goto("quotation_detail", linkedQ.id)} className="border border-slate-300 rounded-lg py-2 text-sm">Lihat Quotation ({linkedQ.status})</button>
          )}
          {sr.status === "siap_invoice" && (
            <button onClick={() => onCreateInvoice(sr)} className="bg-[#123A3A] text-white rounded-lg py-2 text-sm">Quotation Disetujui &rarr; Buat Invoice</button>
          )}
          {sr.status === "invoice_terbit" && linkedInv && (
            <button onClick={() => goto("invoice_detail", linkedInv.id)} className="border border-slate-300 rounded-lg py-2 text-sm">Kelola Pembayaran Invoice</button>
          )}
          {sr.status === "lunas" && (
            <button onClick={() => onUpdateSR({ ...sr, status: "selesai" })} className="bg-[#123A3A] text-white rounded-lg py-2 text-sm">Tutup Servis (Closed)</button>
          )}
          {sr.status === "selesai" && (
            <div className="text-sm text-emerald-600 flex items-center gap-1.5"><CheckCircle2 size={15} /> Servis selesai & closed.</div>
          )}
        </div>
      </Card>
    </div>
  );
}

function InvoiceDetail({ inv, settings, goto, openPrint, onUpdate }) {
  const [amount, setAmount] = useState("");
  const [method, setMethod] = useState("Transfer BCA");
  if (!inv) return <div className="text-sm text-slate-400">Data tidak ditemukan.</div>;

  const homeServiceFee = (inv.distanceKm || 0) * settings.homeServiceRate;
  const { subtotal, discountAmount, grandTotal } = computeTotals(inv.items, inv.discountPercent, homeServiceFee);
  const paidTotal = (inv.payments || []).reduce((s, p) => s + Number(p.amount || 0), 0);
  const remaining = grandTotal - paidTotal;
  const dpTarget = inv.paymentType === "dp" ? Math.round(grandTotal * (settings.dpPercent / 100)) : grandTotal;
  const warrantyUntil = inv.warrantyMonths ? new Date((inv.paidDate || inv.date || inv.createdAt || Date.now()) + inv.warrantyMonths*30*86400000) : null;

  function addPayment() {
    const amt = Number(amount);
    if (!amt || amt <= 0) return;
    const payments = [...(inv.payments || []), { date: Date.now(), amount: amt, method }];
    const newPaid = payments.reduce((s, p) => s + Number(p.amount || 0), 0);
    const status = newPaid >= grandTotal ? "paid" : "unpaid";
    onUpdate({ ...inv, payments, status, paidDate: status === "paid" ? Date.now() : inv.paidDate });
    setAmount("");
  }

  return (
    <div>
      <SectionHeader title={inv.no} subtitle={inv.custName} action={
        <button onClick={() => goto("invoice")} className="text-sm text-slate-500 flex items-center gap-1"><ArrowLeft size={15} /> Kembali</button>
      } />
      <Card className="p-4 mb-3 space-y-2">
        <div className="flex justify-between text-sm"><span className="text-slate-500">Grand Total</span><span className="font-semibold">{formatIDR(grandTotal)}</span></div>
        <div className="flex justify-between text-sm"><span className="text-slate-500">Sudah Dibayar</span><span>{formatIDR(paidTotal)}</span></div>
        <div className="flex justify-between text-sm pt-2 border-t border-slate-100"><span className="text-slate-500">Sisa</span><span className={`font-semibold ${remaining > 0 ? "text-orange-600" : "text-emerald-600"}`}>{formatIDR(Math.max(remaining, 0))}</span></div>
        {inv.warrantyMonths > 0 && <div className="text-[11px] text-violet-700">Garansi {inv.warrantyMonths} bulan — sampai {formatDateID(warrantyUntil)}</div>}
        {inv.status === "cancelled" && <div className="text-[11px] text-red-600 font-medium">DIBATALKAN</div>}
        {inv.paymentType === "dp" && <div className="text-[11px] text-slate-400">Skema DP {settings.dpPercent}%: {formatIDR(dpTarget)} di awal, sisanya sebelum unit diambil.</div>}
      </Card>

      <div className="flex gap-2 mb-3">
        <button onClick={() => goto("invoice_form", inv.id)} className="flex-1 border border-slate-300 rounded-lg py-2 text-sm">Edit</button>
        <button onClick={() => openPrint("INV", inv.id)} className="flex-1 border border-slate-300 rounded-lg py-2 text-sm flex items-center justify-center gap-1.5"><Printer size={14} /> Cetak</button>
        {inv.status !== "cancelled" && <button onClick={() => onUpdate({...inv, status:"cancelled", cancelledAt:Date.now()})} className="border border-red-200 text-red-600 rounded-lg py-2 px-3 text-sm">Cancel</button>}
      </div>

      {inv.status !== "paid" && (
        <Card className="p-4 mb-3">
          <div className="text-xs font-medium text-slate-600 mb-2">Catat Pembayaran</div>
          <div className="flex gap-2">
            <input type="number" value={amount} onChange={e => setAmount(e.target.value)} placeholder="Jumlah" className={inputCls} />
            <select value={method} onChange={e => setMethod(e.target.value)} className={inputCls + " w-36"}>
              <option>Transfer BCA</option>
              <option>Cash</option>
            </select>
            <button onClick={addPayment} className="bg-[#123A3A] text-white rounded-lg px-4 text-sm shrink-0">Catat</button>
          </div>
        </Card>
      )}

      {(inv.payments || []).length > 0 && (
        <Card className="p-4 mb-3">
          <div className="text-xs font-medium text-slate-600 mb-2">Riwayat Pembayaran</div>
          <div className="space-y-1.5">
            {inv.payments.map((p, i) => (
              <div key={i} className="flex justify-between text-sm">
                <span className="text-slate-500">{formatDateID(new Date(p.date))} &middot; {p.method}</span>
                <span>{formatIDR(p.amount)}</span>
              </div>
            ))}
          </div>
        </Card>
      )}

      {inv.status === "paid" && (
        <div className="text-sm text-emerald-600 flex items-center gap-1.5 px-1"><CheckCircle2 size={15} /> Invoice lunas.</div>
      )}
    </div>
  );
}

function PrintScreen({ spec, settings, serviceRequests, quotations, invoices, onBack }) {
  let data, docType = spec.docType;
  if (docType === "SR") data = serviceRequests.find(s => s.id === spec.id);
  if (docType === "QUO") data = quotations.find(q => q.id === spec.id);
  if (docType === "INV") data = invoices.find(i => i.id === spec.id);

  if (!data) return <div className="p-6 text-sm text-slate-400">Dokumen tidak ditemukan.</div>;

  return (
    <div className="min-h-[600px] bg-slate-200 print:bg-white">

      <PrintableDoc docType={docType} data={data} settings={settings} />

  );
}

          <tr>
            <td className="border border-slate-400 px-2 py-1 font-medium w-1/3 bg-slate-50">Cust./ Company Name</td>

          <tr>
            <td className="border border-slate-400 px-2 py-1 font-medium bg-slate-50">Serial Number</td>
            <td className="border border-slate-400 px-2 py-1">: {data.serialNumber || "-"}</td>
          </tr>
          <tr>
            <td className="border border-slate-400 px-2 py-1 font-medium bg-slate-50">Phone/ WhatsApp</td>
            <td className="border border-slate-400 px-2 py-1">: {data.phone || "-"}</td>
          </tr>
          {docType === "SR" && (
            <>
              <tr>
                <td className="border border-slate-400 px-2 py-1 font-medium bg-slate-50">Problem</td>
                <td className="border border-slate-400 px-2 py-1">: {[...(data.problems || []).filter(p => p !== "Lainnya"), data.problemOther].filter(Boolean).join(", ") || "-"}</td>
              </tr>
              <tr>
                <td className="border border-slate-400 px-2 py-1 font-medium bg-slate-50">Kelengkapan Unit</td>
                <td className="border border-slate-400 px-2 py-1">: {[...(data.completeness || []).filter(p => p !== "Lainnya"), data.completenessOther].filter(Boolean).join(", ") || "-"}</td>
              </tr>
            </>
          )}
        </tbody>
      </table>

      <table className="w-full mt-2 text-[12px] border border-slate-400 border-collapse">
        <thead>
          <tr className="bg-slate-100">
            <th className="border border-slate-400 px-2 py-1 w-8">No.</th>
            <th className="border border-slate-400 px-2 py-1 text-left">Description</th>
            <th className="border border-slate-400 px-2 py-1 w-14">Qty</th>
            <th className="border border-slate-400 px-2 py-1 w-28">Price (IDR)</th>
          </tr>
        </thead>
        <tbody>
          {(data.items || []).map((it, i) => (
            <tr key={it.id || i}>
              <td className="border border-slate-400 px-2 py-1 text-center">{i + 1}</td>
              <td className="border border-slate-400 px-2 py-1">{it.desc}</td>
              <td className="border border-slate-400 px-2 py-1 text-center">{it.qty}</td>
              <td className="border border-slate-400 px-2 py-1 text-right">{formatIDR(it.qty * it.price)}</td>
            </tr>
          ))}
          {homeServiceFee > 0 && (
            <tr>
              <td className="border border-slate-400 px-2 py-1 text-center">{(data.items || []).length + 1}</td>
              <td className="border border-slate-400 px-2 py-1">Home Service ({data.distanceKm} KM)</td>
              <td className="border border-slate-400 px-2 py-1 text-center">1</td>
              <td className="border border-slate-400 px-2 py-1 text-right">{formatIDR(homeServiceFee)}</td>
            </tr>
          )}
          {(data.items || []).length === 0 && homeServiceFee === 0 && (
            <tr><td colSpan={4} className="border border-slate-400 px-2 py-3 text-center text-slate-400">-</td></tr>
          )}
        </tbody>
      </table>

      <div className="flex justify-end mt-1">
        <table className="text-[12px] w-64">
          <tbody>
            <tr><td className="py-0.5">SUB TOTAL</td><td className="py-0.5 text-right font-medium">{formatIDR(subtotal)}</td></tr>
            <tr><td className="py-0.5">DISCOUNT ({data.discountPercent || 0}%)</td><td className="py-0.5 text-right">- {formatIDR(discountAmount)}</td></tr>
            <tr className="border-t border-slate-400"><td className="py-1 font-bold">GRAND TOTAL</td><td className="py-1 text-right font-bold">{formatIDR(grandTotal)}</td></tr>
            {docType === "INV" && data.paymentType === "dp" && (
              <>
                <tr><td className="py-0.5 text-slate-500">{settings.dpPercent}% First Payment</td><td className="py-0.5 text-right text-slate-500">{formatIDR(dpTarget)}</td></tr>
                <tr><td className="py-0.5 text-slate-500">Sudah Dibayar</td><td className="py-0.5 text-right text-slate-500">{formatIDR(paidTotal)}</td></tr>
                <tr><td className="py-0.5 text-slate-500">Sisa Tagihan</td><td className="py-0.5 text-right text-slate-500">{formatIDR(Math.max(grandTotal - paidTotal, 0))}</td></tr>
              </>
            )}
          </tbody>
        </table>
      </div>

      {(docType === "QUO" || docType === "INV") && (
        <div className="text-[11px] mt-3 leading-relaxed">
          <div>Transfer Payment: <b>{settings.bankName}</b></div>
          <div>Nomor Rekening: <b>{settings.accountNumber}</b></div>
          <div className="italic">An. {settings.accountHolder}</div>
          <div>Konfirmasi payment ke WhatsApp: <b>{settings.phone}</b></div>
        </div>
      )}

      <div className="flex justify-between items-end mt-8">
        <div className="text-[11px] max-w-[62%] whitespace-pre-line text-slate-600">
          <div className="font-medium text-slate-700 mb-1">Syarat & Ketentuan:</div>
          {terms}
        </div>
        <div className="text-center text-[12px]">
          <div>Terimakasih,</div>
          <div>Hormat Kami</div>
          <img src={TTD_DATA} alt="ttd" className="h-14 object-contain mx-auto -my-1" />
          <div className="font-bold underline">{settings.technician}</div>
          <div className="text-[11px]">Technician</div>
        </div>
      </div>
    </div>
  );
}
/* ============================= CUSTOMER DATABASE ============================= */
function CustomersPage({ customers, serviceRequests, invoices, goto, onClaim }) {
  const [q,setQ]=useState("");
  const filtered=customers.filter(c=>(c.name+" "+c.phone+" "+(c.companyName||"")).toLowerCase().includes(q.toLowerCase()));
  return <div>
    <SectionHeader title="Database Customer" subtitle={`${customers.length} customer tersimpan`}/>
    <div className="relative mb-3"><Search size={15} className="absolute left-3 top-1/2 -translate-y-1/2 text-slate-400"/><input value={q} onChange={e=>setQ(e.target.value)} placeholder="Cari nama / WhatsApp / perusahaan..." className={inputCls+" pl-9"}/></div>
    <Card className="divide-y divide-slate-100">
      {filtered.length===0&&<div className="p-6 text-center text-sm text-slate-400">Belum ada customer.</div>}
      {filtered.map(c=>{
        const custInv=invoices.filter(i=>(i.phone&&c.phone&&i.phone===c.phone)||(i.custName||"").toLowerCase()===(c.name||"").toLowerCase());
        const warranties=custInv.filter(i=>i.status!=="cancelled"&&i.warrantyMonths>0).map(i=>({inv:i,until:new Date((i.paidDate||i.date||i.createdAt)+i.warrantyMonths*30*86400000)})).filter(x=>x.until>=new Date());
        return <div key={c.id} className="p-4">
          <div className="flex items-start justify-between gap-3"><div><div className="font-semibold text-sm">{c.name}</div><div className="text-xs text-slate-500">{c.companyName||"-"} • {c.phone||"-"}</div></div><span className="text-[10px] px-2 py-1 rounded-full bg-slate-100 text-slate-600">{custInv.length} invoice</span></div>
          <div className="mt-3 grid grid-cols-2 gap-2 text-xs">
            <div><span className="text-slate-400">Garansi aktif</span><div className="font-medium">{warranties.length?`${warranties.length} unit`:"Tidak ada"}</div></div>
            <div><span className="text-slate-400">Terakhir</span><div className="font-medium">{custInv[0]?formatDateID(new Date(custInv[0].date||custInv[0].createdAt)):"-"}</div></div>
          </div>
          {warranties.map(x=><div key={x.inv.id} className="mt-2 p-2 rounded-lg bg-emerald-50 text-[11px] text-emerald-800">Garansi {x.inv.model||"unit"} / SN {x.inv.serialNumber||"-"} sampai {formatDateID(x.until)}</div>)}
          <div className="flex gap-2 mt-3"><button onClick={()=>onClaim({...c,name:c.name})} className="flex-1 border border-violet-200 text-violet-700 rounded-lg py-2 text-xs">Klaim Garansi</button><button onClick={()=>goto("invoice")} className="border border-slate-200 rounded-lg px-3 py-2 text-xs">Lihat Invoice</button></div>
        </div>
      })}
    </Card>
  </div>;
}

/* ============================= FINANCIAL REPORT ============================= */
function FinancialReport({ invoices, serviceRequests, inventory, settings }) {
  const [period,setPeriod]=useState("month");
  const now=new Date();
  const start=new Date(now); if(period==="week"){start.setDate(now.getDate()-6)} if(period==="month"){start.setDate(1)} if(period==="year"){start.setMonth(0,1)}
  start.setHours(0,0,0,0);
  const inPeriod=invoices.filter(i=>new Date(i.date||i.createdAt)>=start);
  const active=inPeriod.filter(i=>i.status!=="cancelled");
  const calc=(list)=>list.reduce((acc,i)=>{
    const total=computeTotals(i.items,i.discountPercent,(i.distanceKm||0)*settings.homeServiceRate).grandTotal;
    const paid=(i.payments||[]).reduce((s,p)=>s+Number(p.amount||0),0);
    const cogs=(i.items||[]).reduce((s,it)=>s+Number(it.qty||0)*Number(it.costPrice||0),0);
    return {omzet:acc.omzet+total,revenue:acc.revenue+paid,cogs:acc.cogs+cogs};
  },{omzet:0,revenue:0,cogs:0});
  const x=calc(active), margin=x.revenue-x.cogs, cancelled=inPeriod.filter(i=>i.status==="cancelled");
  const cancelledValue=calc(cancelled).omzet;
  return <div>
    <SectionHeader title="Laporan Keuangan" subtitle="Omzet, revenue, margin, dan pembatalan"/>
    <div className="flex gap-2 mb-4">{[["week","Minggu ini"],["month","Bulan ini"],["year","Tahun ini"]].map(([v,l])=><button key={v} onClick={()=>setPeriod(v)} className={`px-3 py-2 rounded-lg text-xs border ${period===v?"bg-[#123A3A] text-white":"border-slate-300 text-slate-600"}`}>{l}</button>)}</div>
    <div className="grid grid-cols-2 md:grid-cols-3 gap-3 mb-4">
      <Card className="p-4"><div className="text-xs text-slate-500">Omzet</div><div className="text-xl font-semibold mt-1">{formatIDR(x.omzet)}</div></Card>
      <Card className="p-4"><div className="text-xs text-slate-500">Revenue masuk</div><div className="text-xl font-semibold text-emerald-700 mt-1">{formatIDR(x.revenue)}</div></Card>
      <Card className="p-4"><div className="text-xs text-slate-500">Margin kotor</div><div className="text-xl font-semibold text-violet-700 mt-1">{formatIDR(margin)}</div><div className="text-[10px] text-slate-400">{x.revenue?((margin/x.revenue)*100).toFixed(1):0}%</div></Card>
      <Card className="p-4"><div className="text-xs text-slate-500">HPP / COGS</div><div className="text-xl font-semibold mt-1">{formatIDR(x.cogs)}</div></Card>
      <Card className="p-4"><div className="text-xs text-slate-500">Invoice aktif</div><div className="text-xl font-semibold mt-1">{active.length}</div></Card>
      <Card className="p-4"><div className="text-xs text-slate-500">Cancel</div><div className="text-xl font-semibold text-red-600 mt-1">{cancelled.length}</div><div className="text-[10px] text-slate-400">{formatIDR(cancelledValue)}</div></Card>
    </div>
    <Card className="p-4"><div className="text-sm font-semibold mb-2">Catatan perhitungan</div><div className="text-xs text-slate-500 leading-relaxed">Omzet = nilai invoice. Revenue = pembayaran yang benar-benar sudah dicatat. Margin kotor = revenue − HPP item. Untuk hasil margin yang akurat, isi HPP/modal setiap sparepart atau unit di Inventory.</div></Card>
  </div>;
}



const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(React.createElement(App));
</script>
</body>
